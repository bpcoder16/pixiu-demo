# 复制为 nats.<name>.yaml，放在 app.yaml 同目录下。
# name 和 isDefault 由 MustRegisterNATS(name, isDefault) 声明，文件内不重复配置。
# 可选环境前缀，省略、null 或空字符串时不启用；仅允许英文字母、数字、_、-。
# 初始化后固定；发布、Request 和注册均填写原始主题或名称，由客户端统一添加前缀。
# 例如 test1 将 pixiu.demo.tasks 映射为 test1.pixiu.demo.tasks，将 PIXIU_DEMO_TASKS 映射为 test1_PIXIU_DEMO_TASKS。
# Demo 使用独立命名空间，避开同一账户内已有的同名 Stream 和订阅。
namespace: "pixiu_demo"

# 列表中的地址属于同一个逻辑实例，不为每个地址创建独立客户端。
urls:
  - "nats://127.0.0.1:4222"

# 不接受 URL 内嵌凭据；允许均为空，有密码时必须填写用户名。
username: ""
password: ""

# 零值采用以下默认值，负值无效；connectTimeout 是单次拨号而非全部地址总预算。
connectTimeout: "5s"
# 仅限制底层连接 Drain。
drainTimeout: "10s"
# 消费排空、异步确认等待、最终连接关闭共用此整体期限。
closeTimeout: "20s"

# 服务端须开启 JetStream（本地可用 nats-server -js）；客户端配置不会开启它。
# 迁移完成后由 NewNATSConsumerService 读取 nats-register.demo.yaml，服务 Run 时准备 Stream/Consumer。
# 配置冲突会阻止应用启动，不自动更新远端资源。
jetStream:
  # 仅限制默认上下文的异步 PubAck 等待，不影响同步发布或 Consumer AckWait。
  publishAsyncTimeout: "5s"
