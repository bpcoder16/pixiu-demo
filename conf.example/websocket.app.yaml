# 复制到 app.yaml 所在配置目录，由 NewWebSocketService("app", ...) 读取。
# 新增 web/admin 时复制为 websocket.web.yaml / websocket.admin.yaml，配置不同端口并注册独立工厂。
# HTTP 监听字段与 http.yaml 同名、同层；时间使用带单位字符串，如 "5s"。

# WebSocket 独立监听地址，必填；与 http.yaml 的 :8888 独立。
addr: ":8889"
# HTTP 升级路径，必填，使用绝对字面路径；/ready/ws 保留给内置探针。
# 本例 CLI 使用 /ws/app，变更时需同步客户端。
path: "/ws/app"

# 请求头读取期限；零值默认 5s，负值无效。
readHeaderTimeout: "5s"
# 完整 HTTP 请求读取期限；零值默认 10s，负值不设上限。
readTimeout: "10s"
# HTTP 响应写入期限；零值默认 15s，负值不设上限。
writeTimeout: "15s"
# HTTP 空闲连接等待下一次请求的期限；零值默认 60s，负值无效。
idleTimeout: "60s"

# 请求行与请求头总大小上限（字节）；零值默认 64 KiB，负值无效。
maxHeaderBytes: 65536

# /ready/ws 由服务内置；除升级路径与探针外，其他路径均返回 404。
# Session、认证、Origin 校验、心跳和 JSON/PB 参数由 wshandler.NewServer 提供。
# 服务排空共享应用总期限，bootstrap.Start 默认 30s。
