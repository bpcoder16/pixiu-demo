# 与 nats.demo.yaml 放在同一目录；迁移及 Handler 依赖就绪后由 NewNATSConsumerService 读取，服务 Run 时启动消费。
# 不随 MustBaseInit 自动启动消费；namespace 在 nats.demo.yaml 中配置，本文件不接受该字段。
# 此处填写原始名称和主题；Client 为注册、发布和 Request 统一添加前缀。
# 例如 namespace 为 test1 时，名称及非空 queue 添加 test1_，主题添加 test1.。
# Handler 名称不变，回调主题保留前缀；修改 namespace 不迁移或删除旧 Stream/Durable。

# streamDefaults 或 replicas 省略/null 时，使用对应实例初始化时的 urls 条目数；按需取消注释覆盖。
# 最终全局值作为逐项副本数上限，即使没有 Stream 也校验。
# 自动计数不去重、不计入自动发现节点、不裁剪上限；仅适合 urls 完整且不重复列出同一 JetStream 集群节点的部署。
# 仅列种子地址、使用代理入口或需要不同副本策略时应显式配置；副本数最大为 5，通常选 1、3、5，服务端校验范围与集群条件。
# streamDefaults:
#   replicas: 1  # 显式值必须为正整数，0 或负数报错。

streams:  # 可省略、设为 null 或 []；每项必须声明 subjects，统一创建或校验 Stream。
  - name: "PIXIU_DEMO_TASKS"
    subjects:
      - "pixiu.demo.tasks"
    # 以下五项均可省略或设为 null，按需取消注释覆盖。
    # 各项默认值见行内注释。
    # replicas: 1          # 默认沿用显式或自动推导的全局副本数，不得超过全局值；0 或负数也沿用全局值，解码及数字转换沿用 configx。
    # maxBytes: 104857600  # 整数字节数，此例为 100 MiB；默认沿用 natsx Default 的 -1；0 或 -1 不设 Stream 容量上限，仍受账户及服务端配额限制，不接受带单位字符串。
    # retention: "limits"  # 默认沿用 natsx Default 的 limits；可选 limits、interest、workqueue。
    # maxAge: "2160h"      # 默认沿用 natsx Default；消息最大年龄，0 表示不限制年龄；支持 Go 时长单位，不支持 d，范围由服务端校验。
    # duplicates: "2m"     # 默认沿用 natsx Default；消息 ID 去重窗口，0 由服务端确定，不代表关闭去重；范围由服务端校验，maxAge 大于 0 时不得超过它。

    consumers:  # 可省略、设为 null 或 []；每个消费者自动使用当前 Stream 的 name，可配置多个。
      - durable: "demo-worker"  # Durable 独立于 Handler 名称。
        filterSubjects:  # 省略或为空时消费整个 Stream。
          - "pixiu.demo.tasks"
        handler: "HandleTask"  # 须由 JetStreamHandlerRegistry 登记，名称与 registry.go 登记的函数名完全一致。
        # 以下六项均可省略或设为 null，沿用 natsx Default；注释中列出当前默认值。
        # ackWait: "60s"       # ACK 等待时间，必须大于 0；应覆盖预取等待和业务处理时间，支持 Go 时长单位。
        # maxDeliver: 5        # 最大投递次数，包含首次；范围由服务端校验。
        # maxAckPending: 1000  # 同一 Durable 下所有实例合计的未确认消息数上限。
        # consume:
        #   workers: 1         # 本地并发数，不得为负；0 按 1 处理，Handler 须支持并发。
        #   maxMessages: 0     # SDK 预取上限，不得为负；0 为有效 workers 的两倍，不含处理中的消息。
        # retryDelay: "0s"     # 失败重投延迟，不得为负；0 等待 ackWait 超时，正值发送延迟 NAK，支持 Go 时长单位。

coreConsumers:  # 可省略或设为 []。
  - name: "demo-broadcast"
    subject: "pixiu.demo.broadcast"
    handler: "HandleBroadcast"  # 须由 CoreHandlerRegistry 登记，名称与 registry.go 登记的函数名完全一致。
  - name: "demo-queue"
    subject: "pixiu.demo.queue"
    queue: "pixiu-demo-workers"  # 省略或为空时广播。
    subscribers: 4  # 仅在 queue 非空时控制订阅数，此时必填且大于 1；当前 Client 按此数量建订阅，Handler 须支持并发；广播始终只有一个订阅。
    handler: "HandleQueue"  # 须由 CoreHandlerRegistry 登记，名称与 registry.go 登记的函数名完全一致。

# 消费者只在所属 Stream 的 consumers 下声明；不接受旧顶层 jetStreamConsumers 或消费者的 stream 字段。
# 未引用的 Handler 不启动。
# 除上述字段外全部沿用 natsx 的 Default，不支持 enabled、热更新或完整 SDK 配置。
# 删除声明后重启仅停用本进程相应消费，不删除远端资源或进度。
# 已有远端配置不一致时启动失败；从旧手写参数迁移须先显式对齐远端配置。
